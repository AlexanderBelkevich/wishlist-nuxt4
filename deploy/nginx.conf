server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Фото до 5 МБ, плюс запас на служебные части формы
    client_max_body_size 6m;

    location / {
        # Всё, что пришло на домен, передаём приложению в Docker
        proxy_pass http://127.0.0.1:3000;
        # Сообщаем приложению настоящий домен и протокол
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Для потока событий: держать соединение с приложением открытым
        proxy_http_version 1.1;
    }
}