services:
  app:
    # Собрать образ по Dockerfile из этой папки
    build: .
    # Перезапускать после сбоя и после перезагрузки сервера
    restart: unless-stopped
    # Порт 3000 открыт только для этого компьютера. Снаружи сайт будет доступен через nginx
    ports:
      - 127.0.0.1:3000:3000
    # Секреты и настройки — из файла .env
    env_file: .env
    # Постоянный диск для базы и фото: переживёт пересборку и перезапуск
    volumes:
      - wishlist-data:/data

volumes:
  wishlist-data: